# 이 파일은 Dart 코드를 정적 분석하여 오류, 경고, 린트를 확인하도록
# 분석기를 설정합니다.
#
# 분석기가 찾은 문제는 Dart를 지원하는 IDE UI
# (https://dart.dev/tools#ides-and-editors)에 표시되며,
# `flutter analyze` 명령으로도 실행할 수 있습니다.

# 아래 설정은 Flutter 앱/패키지/플러그인에 권장되는 린트 모음을 적용해
# 더 나은 코딩 습관을 장려합니다.
include: package:flutter_lints/flutter.yaml

linter:
  # 필요하다면 아래에서 `package:flutter_lints/flutter.yaml`에 정의된 규칙을
  # 끄거나 새로운 규칙을 추가할 수 있습니다.
  # 전체 린트 목록과 문서는 https://dart.dev/lints 에서 확인하세요.
  #
  # 프로젝트 전체가 아닌 특정 코드 라인이나 파일만 예외 처리하려면
  # `// ignore: lint_이름`, `// ignore_for_file: lint_이름`을 사용하세요.
  rules:
    avoid_print: false  # print 경고 비활성화

# 이 설정 파일에 대한 추가 정보:
# https://dart.dev/guides/language/analysis-options
